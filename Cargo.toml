[workspace]
resolver = "2"
members = [
    "crates/abyss-cstruct",
    "crates/abyss-container",
    "crates/abyss-volume",
    "crates/abyss-ntfs",
    "crates/abyss-extfs",
    "crates/abyss-registry",
    "crates/abyss-target",
    "crates/abyss-output",
    "crates/abyss-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Real-Fruit-Snacks"]

[workspace.dependencies]
# Internal crates
abyss-cstruct = { path = "crates/abyss-cstruct" }
abyss-container = { path = "crates/abyss-container" }
abyss-volume = { path = "crates/abyss-volume" }
abyss-ntfs = { path = "crates/abyss-ntfs" }
abyss-extfs = { path = "crates/abyss-extfs" }
abyss-registry = { path = "crates/abyss-registry" }
abyss-target = { path = "crates/abyss-target" }
abyss-output = { path = "crates/abyss-output" }

# External crates
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
colored = "3"
rustyline = "15"
log = "0.4"
env_logger = "0.11"
